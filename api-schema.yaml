          description: ''
components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    CambiarEstadoRequest:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/CambiarEstadoRequestEstadoEnum'
      required:
      - estado
    CambiarEstadoRequestEstadoEnum:
      enum:
      - activo
      - suspendido
      type: string
      description: |-
        * `activo` - activo
        * `suspendido` - suspendido
    CambiarEstadoResponse:
      type: object
      properties:
        message:
          type: string
        mikrotik_status:
          type: string
        cliente_estado:
          type: string
      required:
      - cliente_estado
      - message
      - mikrotik_status
    ClientePPPoE:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        router_nombre:
          type: string
          readOnly: true
        plan_nombre:
          type: string
          readOnly: true
        usuario_pppoe:
          type: string
          description: User para el secret
          maxLength: 100
        password_pppoe:
          type: string
          description: Password para el secret
          maxLength: 100
        nombre_completo:
          type: string
          maxLength: 200
        estado:
          $ref: '#/components/schemas/EstadoB1eEnum'
        direccion_ip_antena:
          type: string
          nullable: true
          description: IP del equipo o antena que sirve al cliente
        portal_token:
          type: string
          format: uuid
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
        router:
          type: integer
        plan:
          type: integer
      required:
      - creado_en
      - id
      - nombre_completo
      - password_pppoe
      - plan
      - plan_nombre
      - portal_token
      - router
      - router_nombre
      - usuario_pppoe
    ClienteRed:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        router_nombre:
          type: string
          readOnly: true
        plan_nombre:
          type: string
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        direccion_ip:
          type: string
        direccion_mac:
          type: string
          maxLength: 17
        interfaz_mikrotik:
          type: string
          description: Interfaz de LAN usada para reservas ARP estáticas e IP fija
          maxLength: 100
        servidor_dhcp:
          type: string
          description: Nombre opcional del servidor DHCP; déjalo vacío si solo existe
            uno
          maxLength: 100
        cola_mikrotik:
          type: string
          maxLength: 100
        routeros_id:
          type: string
          maxLength: 100
        estado:
          $ref: '#/components/schemas/EstadoB1eEnum'
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
        router:
          type: integer
        plan:
          type: integer
      required:
      - actualizado_en
      - creado_en
      - direccion_ip
      - id
      - nombre
