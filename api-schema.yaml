          type: string
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        direccion_ip:
          type: string
        direccion_mac:
          type: string
          maxLength: 17
        cola_mikrotik:
          type: string
          maxLength: 100
        routeros_id:
          type: string
          maxLength: 100
        estado:
