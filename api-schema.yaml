  /api/clientes-red/{id}/crear-cola/:
    post:
      operationId: clientes_red_crear_cola_create
      description: Consulta por nombre la cola del cliente en RouterOS y la crea o
        actualiza con su IP, plan, parent y estado actuales.
      summary: Crear o reparar la cola del cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente red.
        required: true
      tags:
      - Clientes DHCP e IP fija
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRed'
          application/x-www-form-urlencoded:
            schema:
