  /api/planes/:
    get:
      operationId: planes_list
      description: Obtiene los planes locales con sus velocidades de subida, bajada,
        profile PPP y router asociado.
      summary: Listar planes de velocidad
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Planes de velocidad
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanVelocidad'
          description: ''
    post:
      operationId: planes_create
      description: Guarda el plan en Django y crea o actualiza el profile correspondiente
