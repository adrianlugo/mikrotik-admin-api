openapi: 3.0.3
info:
  title: API de Gestión MikroTik ISP
  version: 1.0.0
  description: Sistema automatizado para la creación, suspensión y monitoreo en tiempo
    real de clientes PPPoE en routers MikroTik.
paths:
  /api/clientes-pppoe/:
    get:
      operationId: clientes_pppoe_list
      description: Retorna la lista completa de clientes registrados en Django. Permite
        filtrar por estado, router y plan, o buscar por nombre.
      summary: Listar todos los clientes PPPoE
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - activo
          - suspendido
        description: |-
          * `activo` - Activo
          * `suspendido` - Suspendido
      - in: query
        name: plan
        schema:
          type: integer
      - in: query
        name: router
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Clientes PPPoE
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientePPPoE'
          description: ''
    post:
      operationId: clientes_pppoe_create
      description: Registra al usuario en la base de datos local y, en simultáneo,
        lo da de alta de forma automática en el MikroTik configurado.
      summary: Crear un nuevo cliente PPPoE
      tags:
      - Clientes PPPoE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
  /api/clientes-pppoe/{id}/:
    get:
      operationId: clientes_pppoe_retrieve
      description: Recupera la información completa de un perfil de cliente PPPoE
        específico mediante su ID único.
      summary: Obtener detalles de un cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
    put:
      operationId: clientes_pppoe_update
      description: Modifica todos los campos de un cliente (ej. cambio de credenciales
        o perfil de velocidad) e impacta los cambios inmediatamente en el MikroTik.
      summary: Actualizar cliente por completo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
    patch:
      operationId: clientes_pppoe_partial_update
      description: Permite realizar modificaciones parciales (ej. modificar solo la
        contraseña) sin necesidad de enviar todo el formulario.
      summary: Actualizar campos específicos del cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientePPPoE'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
    delete:
      operationId: clientes_pppoe_destroy
      description: Remueve el secreto PPPoE del router MikroTik en tiempo real y,
        posteriormente, elimina de forma permanente el registro en Django.
      summary: Eliminar un cliente del sistema
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/clientes-pppoe/{id}/cambiar-estado/:
    post:
      operationId: clientes_pppoe_cambiar_estado_create
      description: Modifica el estado manual de un usuario PPPoE en Django y altera
        su perfil en el MikroTik (lo mueve al perfil de corte o le devuelve su plan
        contratado).
      summary: Cambiar estado del cliente (Suspender/Reactivar)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambiarEstadoResponse'
          description: ''
  /api/clientes-pppoe/activos/:
    get:
      operationId: clientes_pppoe_activos_retrieve
      description: Consulta mediante la API del MikroTik las conexiones activas en
        tiempo real del primer router configurado.
      summary: Listar usuarios activos en MikroTik
      tags:
      - Monitoreo MikroTik
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuariosActivosResponse'
          description: ''
  /api/clientes-pppoe/importar-desde-mikrotik/:
    post:
      operationId: clientes_pppoe_importar_desde_mikrotik_create
      description: Ruta antigua conservada por compatibilidad. Ejecuta la misma sincronización
        bidireccional que el endpoint sincronizar; se recomienda migrar a /api/routers/{id}/sincronizar/.
      summary: Importar datos desde MikroTik (compatible)
      tags:
      - Sincronización MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacionMikrotikResponse'
          description: ''
  /api/clientes-pppoe/sincronizar/:
    post:
      operationId: clientes_pppoe_sincronizar_create
      description: Sincroniza perfiles y secretos en ambos sentidos usando el primer
        router configurado. Se recomienda usar el endpoint específico por router.
      summary: Sincronizar con el primer router
      tags:
      - Sincronización MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SincronizacionClienteResponse'
          description: ''
  /api/planes/:
    get:
      operationId: planes_list
      description: Obtiene los planes locales con sus velocidades de subida, bajada,
        profile PPP y router asociado.
      summary: Listar planes de velocidad
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Planes de velocidad
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanVelocidad'
          description: ''
    post:
      operationId: planes_create
      description: Guarda el plan en Django y crea o actualiza el profile correspondiente
        en su router MikroTik.
      summary: Crear un plan de velocidad
      tags:
      - Planes de velocidad
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanVelocidad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanVelocidad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanVelocidad'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVelocidad'
          description: ''
  /api/planes/{id}/:
    get:
      operationId: planes_retrieve
      description: Obtiene toda la información de un plan específico mediante su identificador.
      summary: Consultar un plan de velocidad
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plan velocidad.
        required: true
      tags:
      - Planes de velocidad
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVelocidad'
          description: ''
    put:
      operationId: planes_update
      description: Reemplaza todos los datos editables del plan y lo mantiene alineado
        con la configuración local.
      summary: Actualizar completamente un plan
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plan velocidad.
        required: true
      tags:
      - Planes de velocidad
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanVelocidad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanVelocidad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanVelocidad'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVelocidad'
          description: ''
    patch:
      operationId: planes_partial_update
      description: Modifica únicamente los campos enviados; por ejemplo, la velocidad
        de subida o bajada.
      summary: Actualizar parcialmente un plan
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plan velocidad.
        required: true
      tags:
      - Planes de velocidad
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlanVelocidad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlanVelocidad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlanVelocidad'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVelocidad'
          description: ''
    delete:
      operationId: planes_destroy
      description: Elimina el plan local cuando ningún cliente protegido lo utiliza.
      summary: Eliminar un plan de velocidad
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plan velocidad.
        required: true
      tags:
      - Planes de velocidad
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/routers/:
    get:
      operationId: routers_list
      description: Obtiene los routers MikroTik configurados en la API.
      summary: Listar routers
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Routers MikroTik
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Router'
          description: ''
    post:
      operationId: routers_create
      description: Registra la dirección, credenciales y puerto API de un router.
      summary: Registrar un router
      tags:
      - Routers MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Router'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Router'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Router'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Router'
          description: ''
  /api/routers/{id}/:
    get:
      operationId: routers_retrieve
      description: Obtiene los datos de configuración de un router específico.
      summary: Obtener un router
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this router.
        required: true
      tags:
      - Routers MikroTik
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Router'
          description: ''
    put:
      operationId: routers_update
      description: Reemplaza la configuración completa de un router.
      summary: Actualizar un router
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this router.
        required: true
      tags:
      - Routers MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Router'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Router'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Router'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Router'
          description: ''
    patch:
      operationId: routers_partial_update
      description: Modifica únicamente los campos enviados de un router.
      summary: Actualizar parcialmente un router
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this router.
        required: true
      tags:
      - Routers MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRouter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRouter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRouter'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Router'
          description: ''
    delete:
      operationId: routers_destroy
      description: Elimina la configuración local de un router si no tiene datos protegidos
        asociados.
      summary: Eliminar un router
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this router.
        required: true
      tags:
      - Routers MikroTik
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/routers/{id}/estado/:
    get:
      operationId: routers_estado_retrieve
      description: Devuelve configuración local, resultado de conexión y cantidades
        de planes y clientes asociados.
      summary: Consultar estado del router
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this router.
        required: true
      tags:
      - Routers MikroTik
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Router'
          description: ''
  /api/routers/{id}/sincronizar/:
    post:
      operationId: routers_sincronizar_create
      description: Crea o actualiza en ambos sentidos los profiles, planes, secretos
        PPPoE y clientes asociados a este router.
      summary: Sincronizar este router
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this router.
        required: true
      tags:
      - Routers MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Router'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Router'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Router'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Router'
          description: ''
  /api/routers/{id}/verificar-conexion/:
    post:
      operationId: routers_verificar_conexion_create
      description: Abre una conexión API, consulta recursos básicos y devuelve identidad,
        versión y uptime del MikroTik.
      summary: Verificar conexión del router
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this router.
        required: true
      tags:
      - Routers MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Router'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Router'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Router'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Router'
          description: ''
components:
  schemas:
    CambiarEstadoRequest:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/CambiarEstadoRequestEstadoEnum'
      required:
      - estado
    CambiarEstadoRequestEstadoEnum:
      enum:
      - activo
      - suspendido
      type: string
      description: |-
        * `activo` - activo
        * `suspendido` - suspendido
    CambiarEstadoResponse:
      type: object
      properties:
        message:
          type: string
        mikrotik_status:
          type: string
        cliente_estado:
          type: string
      required:
      - cliente_estado
      - message
      - mikrotik_status
    ClientePPPoE:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        router_nombre:
          type: string
          readOnly: true
        plan_nombre:
          type: string
          readOnly: true
        usuario_pppoe:
          type: string
          description: User para el secret
          maxLength: 100
        password_pppoe:
          type: string
          description: Password para el secret
          maxLength: 100
        nombre_completo:
          type: string
          maxLength: 200
        estado:
          $ref: '#/components/schemas/ClientePPPoEEstadoEnum'
        creado_en:
          type: string
          format: date-time
          readOnly: true
        router:
          type: integer
        plan:
          type: integer
      required:
      - creado_en
      - id
      - nombre_completo
      - password_pppoe
      - plan
      - plan_nombre
      - router
      - router_nombre
      - usuario_pppoe
    ClientePPPoEEstadoEnum:
      enum:
      - activo
      - suspendido
      type: string
      description: |-
        * `activo` - Activo
        * `suspendido` - Suspendido
    ImportacionMikrotikResponse:
      type: object
      properties:
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - details
      - message
    PatchedClientePPPoE:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        router_nombre:
          type: string
          readOnly: true
        plan_nombre:
          type: string
          readOnly: true
        usuario_pppoe:
          type: string
          description: User para el secret
          maxLength: 100
        password_pppoe:
          type: string
          description: Password para el secret
          maxLength: 100
        nombre_completo:
          type: string
          maxLength: 200
        estado:
          $ref: '#/components/schemas/ClientePPPoEEstadoEnum'
        creado_en:
          type: string
          format: date-time
          readOnly: true
        router:
          type: integer
        plan:
          type: integer
    PatchedPlanVelocidad:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre_perfil:
          type: string
          maxLength: 100
        subida_mbps:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Velocidad de subida en Mbps
        bajada_mbps:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Velocidad de bajada en Mbps
        router:
          type: integer
    PatchedRouter:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        password:
          type: string
          writeOnly: true
        nombre:
          type: string
          maxLength: 100
        ip_address:
          type: string
        puerto_api:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        usuario:
          type: string
          maxLength: 50
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
