openapi: 3.0.3
info:
  title: API de Gestión MikroTik ISP
  version: 1.0.0
  description: Sistema automatizado para la creación, suspensión y monitoreo en tiempo
    real de clientes PPPoE en routers MikroTik.
paths:
  /api/clientes-pppoe/:
    get:
      operationId: clientes_pppoe_list
      description: Retorna la lista completa de clientes registrados en Django. Permite
        filtrar por estado, router y plan, o buscar por nombre.
      summary: Listar todos los clientes PPPoE
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - activo
          - suspendido
        description: |-
          * `activo` - Activo
          * `suspendido` - Suspendido
      - in: query
        name: plan
        schema:
          type: integer
      - in: query
        name: router
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Clientes PPPoE
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientePPPoEList'
          description: ''
    post:
      operationId: clientes_pppoe_create
      description: Registra al usuario en la base de datos local y, en simultáneo,
        lo da de alta de forma automática en el MikroTik configurado.
      summary: Crear un nuevo cliente PPPoE
      tags:
      - Clientes PPPoE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
  /api/clientes-pppoe/{id}/:
    get:
      operationId: clientes_pppoe_retrieve
      description: Recupera la información completa de un perfil de cliente PPPoE
        específico mediante su ID único.
      summary: Obtener detalles de un cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
    put:
      operationId: clientes_pppoe_update
      description: Modifica todos los campos de un cliente (ej. cambio de credenciales
        o perfil de velocidad) e impacta los cambios inmediatamente en el MikroTik.
      summary: Actualizar cliente por completo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
    patch:
      operationId: clientes_pppoe_partial_update
      description: Permite realizar modificaciones parciales (ej. modificar solo la
        contraseña) sin necesidad de enviar todo el formulario.
      summary: Actualizar campos específicos del cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientePPPoE'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
    delete:
      operationId: clientes_pppoe_destroy
      description: Remueve el secreto PPPoE del router MikroTik en tiempo real y,
        posteriormente, elimina de forma permanente el registro en Django.
      summary: Eliminar un cliente del sistema
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/clientes-pppoe/{id}/cambiar-estado/:
    post:
      operationId: clientes_pppoe_cambiar_estado_create
      description: Modifica el estado manual de un usuario PPPoE en Django y altera
        su perfil en el MikroTik (lo mueve al perfil de corte o le devuelve su plan
        contratado).
      summary: Cambiar estado del cliente (Suspender/Reactivar)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambiarEstadoRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambiarEstadoResponse'
          description: ''
  /api/clientes-pppoe/{id}/patear/:
    post:
      operationId: clientes_pppoe_patear_create
      description: Elimina las sesiones activas PPPoE del usuario para obligarlo a
        autenticarse nuevamente.
      summary: Desconectar sesión PPPoE activa
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Monitoreo MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientePPPoE'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientePPPoE'
          description: ''
  /api/clientes-pppoe/{id}/ping/:
    post:
      operationId: clientes_pppoe_ping_create
      description: Usa la IP de antena guardada del cliente, o la IP enviada como
        'ip', y ejecuta un diagnóstico desde el propio MikroTik.
      summary: Hacer ping desde el router al equipo del cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Monitoreo MikroTik
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PingClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PingClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PingClienteRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingClienteResponse'
          description: ''
  /api/clientes-pppoe/{id}/rotar-portal-token/:
    post:
      operationId: clientes_pppoe_rotar_portal_token_create
      description: 'Genera un portal_token nuevo para el cliente e invalida el anterior:
        el enlace viejo del portal deja de funcionar. Solo para administradores. El
        token nuevo se devuelve una sola vez en la respuesta.'
      summary: Rotar el token del portal del cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente pp po e.
        required: true
      tags:
      - Clientes PPPoE
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  cliente:
                    type: string
                  portal_token:
                    type: string
                  mensaje:
                    type: string
          description: ''
  /api/clientes-pppoe/activos/:
    get:
      operationId: clientes_pppoe_activos_retrieve
      description: Consulta en el router asociado al conjunto de clientes las sesiones
        PPP activas reportadas por RouterOS. Los nombres mostrados permiten identificar
        qué usuarios tienen una conexión establecida actualmente.
      summary: Listar usuarios activos en MikroTik
      tags:
      - Monitoreo MikroTik
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuariosActivosResponse'
          description: ''
  /api/clientes-red/:
    get:
      operationId: clientes_red_list
      description: Lista los clientes de red registrados y permite filtrar por router,
        plan, tipo y estado.
      summary: Listar clientes DHCP e IP fija
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - activo
          - suspendido
        description: |-
          * `activo` - Activo
          * `suspendido` - Suspendido
      - in: query
        name: plan
        schema:
          type: integer
      - in: query
        name: router
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - dhcp
          - ip_fija
        description: |-
          * `dhcp` - DHCP
          * `ip_fija` - IP fija
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Clientes DHCP e IP fija
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClienteRedList'
          description: ''
    post:
      operationId: clientes_red_create
      description: Crea el registro, sincroniza una reserva DHCP o ARP estática y
        genera la cola simple del cliente.
      summary: Crear un cliente DHCP o IP fija
      tags:
      - Clientes DHCP e IP fija
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClienteRed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClienteRed'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteRed'
          description: ''
  /api/clientes-red/{id}/:
    get:
      operationId: clientes_red_retrieve
      description: Obtiene el registro y los datos de reserva, plan, dirección IP/MAC,
        cola y estado.
      summary: Consultar un cliente DHCP o IP fija
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente red.
        required: true
      tags:
      - Clientes DHCP e IP fija
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteRed'
          description: ''
    put:
      operationId: clientes_red_update
      description: Reemplaza los datos editables y vuelve a sincronizar reserva, cola,
        límites y estado.
      summary: Actualizar completamente un cliente de red
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente red.
        required: true
      tags:
      - Clientes DHCP e IP fija
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClienteRed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClienteRed'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteRed'
          description: ''
    patch:
      operationId: clientes_red_partial_update
      description: Modifica los campos enviados y sincroniza reserva y cola correspondientes.
      summary: Actualizar parcialmente un cliente de red
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente red.
        required: true
      tags:
      - Clientes DHCP e IP fija
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClienteRed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClienteRed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClienteRed'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteRed'
          description: ''
    delete:
      operationId: clientes_red_destroy
      description: Elimina primero la cola y la reserva de RouterOS; después elimina
        el registro local si ambas operaciones tuvieron éxito.
      summary: Eliminar un cliente DHCP o IP fija
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente red.
        required: true
      tags:
      - Clientes DHCP e IP fija
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/clientes-red/{id}/crear-cola/:
    post:
      operationId: clientes_red_crear_cola_create
      description: Repara la reserva DHCP o ARP y la cola simple del cliente con su
        IP, MAC, plan, parent y estado actuales.
      summary: Crear o reparar la cola del cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cliente red.
        required: true
      tags:
      - Clientes DHCP e IP fija
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClienteRed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClienteRed'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteRed'
          description: ''
  /api/facturas/:
    get:
      operationId: facturas_list
      description: Lista facturas con cliente, período, monto, vencimiento y estado.
        Permite controlar saldos pendientes y vencidos.
      summary: Listar facturas
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Facturación
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacturaList'
          description: ''
    post:
      operationId: facturas_create
      description: Registra una factura mensual para un cliente. No debe existir otra
        factura del mismo período para ese cliente.
      summary: Crear una factura
      tags:
      - Facturación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Factura'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Factura'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Factura'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
          description: ''
  /api/facturas/{id}/:
    get:
      operationId: facturas_retrieve
      description: Obtiene los datos completos de una factura y su cliente asociado.
      summary: Consultar una factura
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this factura.
        required: true
      tags:
      - Facturación
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
          description: ''
    put:
      operationId: facturas_update
      description: Reemplaza los datos editables de una factura.
      summary: Actualizar una factura
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this factura.
        required: true
      tags:
      - Facturación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Factura'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Factura'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Factura'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
          description: ''
    patch:
      operationId: facturas_partial_update
      description: Modifica solamente los campos enviados de una factura.
      summary: Actualizar parcialmente una factura
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this factura.
        required: true
      tags:
      - Facturación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFactura'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFactura'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFactura'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
          description: ''
    delete:
      operationId: facturas_destroy
      description: Elimina la factura si las restricciones de integridad de Django
        lo permiten.
      summary: Eliminar una factura
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this factura.
        required: true
      tags:
      - Facturación
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/pagos/:
    get:
      operationId: pagos_list
      description: Lista los pagos registrados y permite comprobar qué factura recibió
        cada abono.
      summary: Listar pagos
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Pagos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPagoList'
          description: ''
    post:
      operationId: pagos_create
      description: Registra un pago sobre una factura y lo asociará al usuario autenticado.
        La factura pasa a pagada cuando los pagos alcanzan su monto total.
      summary: Registrar un pago
      tags:
      - Pagos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pago'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pago'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Pago'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
          description: ''
  /api/pagos/{id}/:
    get:
      operationId: pagos_retrieve
      description: Obtiene el monto, método, referencia, usuario registrante y fecha
        de un pago.
      summary: Consultar un pago
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this pago.
        required: true
      tags:
      - Pagos
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
          description: ''
    put:
      operationId: pagos_update
      description: Reemplaza los datos editables de un pago sin cambiar el usuario
        registrante.
      summary: Actualizar un pago
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this pago.
        required: true
      tags:
      - Pagos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pago'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pago'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Pago'
        required: true
      security:
      - tokenAuth: []
