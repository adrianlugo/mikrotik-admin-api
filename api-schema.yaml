            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
          description: ''
    patch:
      operationId: facturas_partial_update
      description: Modifica únicamente los campos enviados y sincroniza después la
        cola correspondiente.
      summary: Actualizar parcialmente un cliente de red
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this factura.
        required: true
      tags:
      - Clientes DHCP e IP fija
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFactura'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFactura'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFactura'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
          description: ''
    delete:
      operationId: facturas_destroy
      description: Elimina primero la cola simple de RouterOS; el registro local solo
        se elimina si la operación termina correctamente.
      summary: Eliminar cliente DHCP o IP fija
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this factura.
        required: true
      tags:
      - Clientes DHCP e IP fija
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
