  /api/facturas/:
    get:
      operationId: facturas_list
      description: Lista los clientes de red registrados. Permite filtrar por router,
        plan, tipo y estado; y buscar por nombre, IP o MAC.
      summary: Listar clientes DHCP e IP fija
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Clientes DHCP e IP fija
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Factura'
          description: ''
    post:
      operationId: facturas_create
      description: Registra el cliente y crea inmediatamente una cola simple en su
        router. La cola se ancla al cola_padre del plan cuando está configurada.
      summary: Crear un cliente DHCP o IP fija
      tags:
      - Clientes DHCP e IP fija
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Factura'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Factura'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Factura'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
          description: ''
  /api/facturas/{id}/:
    get:
      operationId: facturas_retrieve
      description: Obtiene el registro, su plan, dirección IP/MAC, estado y nombre
        de la cola administrada en RouterOS.
      summary: Consultar un cliente DHCP o IP fija
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this factura.
        required: true
      tags:
      - Clientes DHCP e IP fija
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factura'
          description: ''
    put:
      operationId: facturas_update
      description: Reemplaza los datos editables y vuelve a sincronizar target, límites,
        estado y parent de la cola.
      summary: Actualizar completamente un cliente de red
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this factura.
        required: true
      tags:
      - Clientes DHCP e IP fija
      requestBody:
        content:
